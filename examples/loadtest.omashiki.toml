# Omashiki — load-test registry fragment.
#
# Appended to omashiki.toml, never a config on its own: it declares only
# presets, credentials, and environments, and relies on the [runtimes],
# [caches], and [repositories] sections of the file it is appended to.
#
#   cat examples/loadtest.omashiki.toml >> omashiki.toml
#
# Undo with `git checkout -- omashiki.toml`.
#
# This lived inside the tracked omashiki.toml until it was extracted here. It
# does not belong there: `${env:OPENROUTER_API_KEY}` and
# `${env:OMASHIKI_LOCAL_LLM_BASE_URL}` resolve at load and abort the boot when
# unset, so a fresh clone could not start without two variables that only a
# load-test operator has. Both are in .env.example.
#
# Driven by .scripts/loadtest/drive.py, which defaults to `--environment
# loadtest` (the deterministic fake-provider tier). See
# .scripts/loadtest/README.md for the tier-by-tier walkthrough.

[presets.lt-stub]
plugin = "jcode"
options = { timeout_ms = 120000, model = "fake-model" }

[presets.lt-opencode-go]
plugin = "opencode"
options = { model = "opencode-go/glm-5.3-flash" }

[presets.lt-openrouter]
plugin = "opencode"
options = { model = "z-ai/glm-5.3-flash" }

[presets.lt-codex]
plugin = "codex"
options = { model = "gpt-5.6-luna", reasoning_effort = "low", timeout_ms = 600000 }

[presets.lt-qwen]
plugin = "opencode"
options = { model = "qwen/qwen3.5-9b" }

[presets.lt-jcode]
plugin = "jcode"
options = { timeout_ms = 600000, model = "qwen/qwen3.5-9b" }

[credentials.loadtest-fake]
provider = "openai"
model = "fake-model"
api_key = "unused-by-the-stub"
base_url = "http://127.0.0.1:8787/v1"

[credentials.openrouter]
provider = "openrouter"
model = "z-ai/glm-5.3-flash"
base_url = "https://openrouter.ai/api/v1"
api_key = "${env:OPENROUTER_API_KEY}"

[credentials.qwen-local]
provider = "llamacpp"
model = "qwen/qwen3.5-9b"
base_url = "${env:OMASHIKI_LOCAL_LLM_BASE_URL}"
api_key = "unused-by-llama-server"

[host_credentials.opencode-go]
kind = "opencode"
auth = "~/.local/share/opencode/auth.json"
config = "~/.config/omashiki/loadtest/opencode-go.json"

[environments.loadtest]
preset = "lt-stub"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["loadtest-fake"]
caches = []
timeout_ms = 120000
network = "host"
mounts = []
post_steps = []
pre_steps = []

[environments.loadtest.policy]
mode = "off"

[environments.loadtest.resources]
cpus = 0.25
memory = "128MB"
pids = 128

[environments.lt-opencode-go]
preset = "lt-opencode-go"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["opencode-go"]
caches = ["global"]
timeout_ms = 600000
network = "host"
mounts = []
pre_steps = []
post_steps = []

[environments.lt-opencode-go.policy]
mode = "off"

[environments.lt-opencode-go.resources]
cpus = 1.0
memory = "1GB"
pids = 256

[environments.lt-openrouter]
preset = "lt-openrouter"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["openrouter"]
caches = ["global"]
timeout_ms = 600000
network = "host"
mounts = []
pre_steps = []
post_steps = []

[environments.lt-openrouter.policy]
mode = "off"

[environments.lt-openrouter.resources]
cpus = 0.5
memory = "1GB"
pids = 256

[environments.lt-codex]
preset = "lt-codex"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["codex-local"]
caches = ["global"]
timeout_ms = 600000
network = "host"
mounts = []
pre_steps = []
post_steps = []

[environments.lt-codex.policy]
mode = "off"

[environments.lt-codex.resources]
cpus = 1.0
memory = "512MB"
pids = 256

[environments.lt-qwen]
preset = "lt-qwen"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["qwen-local"]
caches = ["global"]
timeout_ms = 600000
network = "host"
mounts = []
pre_steps = []
post_steps = []

[environments.lt-qwen.policy]
mode = "off"

[environments.lt-qwen.resources]
cpus = 0.25
memory = "1GB"
pids = 256

[environments.lt-jcode]
preset = "lt-jcode"
runtime = "docker.runc.debian"
sink = "git"
packages = []
executables = ["git"]
credentials = ["qwen-local"]
caches = []
timeout_ms = 600000
network = "host"
mounts = []
pre_steps = []
post_steps = []

[environments.lt-jcode.policy]
mode = "off"

[environments.lt-jcode.resources]
cpus = 0.25
memory = "128MB"
pids = 128
# <<< loadtest-local end
