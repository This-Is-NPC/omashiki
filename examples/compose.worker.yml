# Remote worker: same release image, worker role, enroll listener on 4012.
#
# On the execution host (needs access to the Docker daemon), create the
# cache and state directories, so that they belong to your account, and
# add the account the worker runs as to .env:
#   mkdir -p ~/.cache/omashiki ~/.local/state/omashiki
#   cat >> .env <<EOF
#   OMASHIKI_UID=$(id -u)
#   OMASHIKI_GID=$(id -g)
#   OMASHIKI_DOCKER_GID=$(stat -c %g /var/run/docker.sock)
#   EOF
#
# Build and start:
#   docker compose --env-file .env -f examples/compose.worker.yml build
#   docker compose --env-file .env -f examples/compose.worker.yml up -d
#
# From the laptop, after the manager is reachable, enroll once:
#   mise run worker:enroll
#
# OMASHIKI_HOST_HOME (default HOME) names this machine's home directory, so
# Git mirrors, worktrees and job directories resolve to the same paths as the
# host Docker daemon.
#
# Mount host credential origins read-only with a compose.override.yml:
# see docs/how-to-configure-model-access.md.

services:
  worker:
    image: omashiki/worker:local
    build:
      context: ../server
      dockerfile: Dockerfile
    # The worker runs as the operator, so what it writes in the mounted host
    # directories belongs to them, and in the Docker socket's group, so it
    # can start the job containers.
    user: "${OMASHIKI_UID:?set OMASHIKI_UID to your user id}:${OMASHIKI_GID:?set OMASHIKI_GID to your group id}"
    group_add:
      - "${OMASHIKI_DOCKER_GID:?set OMASHIKI_DOCKER_GID to the group of /var/run/docker.sock}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The host Docker daemon starts the job containers and mounts paths
      # the worker names, so the worker uses the host's home directory.
      HOME: ${OMASHIKI_HOST_HOME:-${HOME}}
      # Job work directories, file results and the sockets jobs mount live
      # in the temporary directory, which the daemon must see at the same
      # path, so it sits in the mounted cache, one per worker.
      TMPDIR: ${OMASHIKI_HOST_HOME:-${HOME}}/.cache/omashiki/tmp/${COMPOSE_PROJECT_NAME}
      OMASHIKI_ROLE: worker
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-change-me}
      OMASHIKI_NODE: ${OMASHIKI_NODE:-worker-1}
      OMASHIKI_WORKER_CONFIG: /config/worker.toml
      OMASHIKI_ENROLL_SECRET: ${OMASHIKI_ENROLL_SECRET:?set OMASHIKI_ENROLL_SECRET}
      OMASHIKI_ENROLL_PORT: ${OMASHIKI_ENROLL_PORT:-4012}
      # Enrollment, one file per worker in the mounted state directory.
      OMASHIKI_WORKER_STATE_PATH: ${OMASHIKI_HOST_HOME:-${HOME}}/.local/state/omashiki/workers/${COMPOSE_PROJECT_NAME}.json
      OMASHIKI_DOCKER_SOCKET_PATH: /var/run/docker.sock
      # Job containers join the agents network below, where the worker
      # reaches each one.
      OMASHIKI_AGENT_NETWORK_MODE: ${COMPOSE_PROJECT_NAME}-agents
    ports:
      - "${OMASHIKI_ENROLL_PORT:-4012}:${OMASHIKI_ENROLL_PORT:-4012}"
    volumes:
      - ./worker.toml:/config/worker.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OMASHIKI_HOST_HOME:-${HOME}}/.cache/omashiki:${OMASHIKI_HOST_HOME:-${HOME}}/.cache/omashiki
      # Enrollment and cache use records.
      - ${OMASHIKI_HOST_HOME:-${HOME}}/.local/state/omashiki:${OMASHIKI_HOST_HOME:-${HOME}}/.local/state/omashiki
      # Agent secret files land in /dev/shm; share the host path so the
      # daemon can bind-mount them into job containers.
      - /dev/shm:/dev/shm
    networks:
      - agents

networks:
  # Named after the Compose project, so workers on one Docker daemon keep
  # their job containers apart.
  agents:
    name: ${COMPOSE_PROJECT_NAME}-agents
