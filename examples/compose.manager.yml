# Manager control plane: PostgreSQL + Omashiki release in manager role.
#
# Prerequisite: copy a product registry to the repository root, for example
#   cp examples/single-node.omashiki.toml ../omashiki.toml
#
# Build and start:
#   docker compose -f examples/compose.manager.yml build
#   docker compose -f examples/compose.manager.yml up -d
#
# Export OMASHIKI_WORKER_TOKEN and OMASHIKI_ENROLL_SECRET in .env before
# starting the worker stack; the enroll script sends the same worker token.
#
# Many houses, the same machines: run this file once per house under its own
# Compose project name, port, config directory and worker token, then enroll
# the same worker into each house with a distinct --manager-id:
#   MANAGER_PORT=4010 OMASHIKI_CONFIG_DIR=/srv/ana \
#     OMASHIKI_WORKER_TOKEN=$ANA_TOKEN docker compose -p ana -f examples/compose.manager.yml up -d
#   MANAGER_PORT=4020 OMASHIKI_CONFIG_DIR=/srv/joao \
#     OMASHIKI_WORKER_TOKEN=$JOAO_TOKEN docker compose -p joao -f examples/compose.manager.yml up -d
#   mise run worker:enroll -- --manager-id ana  --manager-url http://ana.lan:4010  --worker-token $ANA_TOKEN
#   mise run worker:enroll -- --manager-id joao --manager-url http://joao.lan:4020 --worker-token $JOAO_TOKEN
# Each project gets its own pgdata volume; the worker keeps mirrors, state and
# results apart per manager id and completes each job only to its own house.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omashiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omashiki"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s

  manager:
    image: omashiki/manager:local
    build:
      context: ../server
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMASHIKI_ROLE: manager
      PHX_SERVER: "true"
      DATABASE_URL: ecto://postgres:postgres@db/omashiki
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-change-me}
      OMASHIKI_WORKER_TOKEN: ${OMASHIKI_WORKER_TOKEN:-worker-token-change-me}
      OMASHIKI_CONFIG: /config/omashiki.toml
      OMASHIKI_UI_CONFIG: /config/ui.toml
      PORT: ${MANAGER_PORT:-4010}
      # OMASHIKI_MANAGER_URL passed to worker:enroll must be reachable FROM the
      # worker host (LAN, Tailscale, public), not 127.0.0.1 on the laptop.
    ports:
      - "${MANAGER_PORT:-4010}:${MANAGER_PORT:-4010}"
    volumes:
      # The directory holding omashiki.toml and ui.toml, writable: the Config
      # screen's Files page saves by renaming a new file over the old one,
      # which a single-file bind mount cannot take, and keeps named copies and
      # history in .omashiki-files/ beside them.
      - ${OMASHIKI_CONFIG_DIR:-..}:/config

volumes:
  pgdata:
