[tools]
elixir = "1.17.3-otp-27"
erlang  = "27.2"
python  = "3.12"
rebar   = "3.27.0"

[env]
MIX_REBAR3 = "rebar3"

[tasks.up]
description = "Start db + migrate + assets + images, then run Phoenix (foreground)"
depends     = ["server"]
run         = "true"

[tasks."up:fresh"]
description = "Nuke everything, then start fresh"
depends     = ["nuke"]
run         = "mise run up"

[tasks.stop]
description = "Stop the database container"
depends     = ["db-stop"]
run         = "true"

# --- Local CI ---
#
# Suite taxonomy:
#   ci:server              Backwards-compatible alias: full mix test (fast + integration)
#   ci:server:fast         ExUnit excluding :integration and real providers
#   ci:server:integration  ExUnit only :integration
#   ci:server:real-provider Opt-in OpenCode provider E2E
#   ci:server:assets       Compile Tailwind/esbuild assets in test env
#   ci:server:vuln         Reject vulnerable or retired Hex dependencies
#   ci:server:cover        mix test --cover (non-blocking, prints summary)
#   ci:docker:server       Dry-run build of server image
#   ci:docker:agent        Dry-run build of opencode agent image
#   ci:docker              Composite: docker:server + every agent image
#
# Every agent image build is followed by .scripts/agent_image_check.sh, which
# asserts a size budget and that the image can actually execute the binaries
# entrypoint.sh and omashiki.toml pre_steps depend on. Both halves are needed:
# an image missing `mise` is small and green and fails every job at runtime.
#
# The two images whose environment declares a `mise install --yes` pre_step
# also run .scripts/agent_toolchain_check.sh, which performs that install for
# real. Executing `mise --version` does not prove `mise install` works: mise
# builds erlang from source with kerl, so a base with no C toolchain passes
# the dependency contract above and still fails the pre_step. That check costs
# roughly two minutes per image and is the only part of this matrix that
# compiles anything.

[tasks."ci:server"]
description = "Start DB, compile server with warnings-as-errors, run full mix test"
run         = """
mise run db-up
cd server
MIX_ENV=test mix deps.compile
MIX_ENV=test mix compile --warnings-as-errors
MIX_ENV=test mix test
"""

[tasks."ci:server:fast"]
description = "Server tests excluding :integration and real providers"
run         = """
mise run db-up
cd server
MIX_ENV=test mix deps.compile
MIX_ENV=test mix compile --warnings-as-errors
MIX_ENV=test mix test --exclude integration --exclude real_opencode --exclude real_claude --exclude real_jcode
"""

[tasks."ci:server:integration"]
description = "Server :integration tests only (no real provider)"
run         = """
mise run db-up
cd server
MIX_ENV=test mix test --only integration
"""

[tasks."ci:server:real-provider"]
description = "Run the prepared overture real-provider E2E"
run         = "mise run e2e:overture:opencode"

[tasks."ci:server:assets"]
description = "Compile Tailwind + esbuild bundles in test env, and assert they stay out of git"
dir         = "server"
run         = """
MIX_ENV=test mix tailwind omashiki
MIX_ENV=test mix esbuild omashiki

# priv/static/assets is build output and is gitignored (see server/.gitignore).
# If building it dirties git, a bundle has been committed again, and the tree
# once more contains an artifact that no build target reproduces. Fail here
# rather than let a stale bundle reach production.
dirty="$(git status --porcelain -- priv/static/assets)"
if [ -n "$dirty" ]; then
  echo "ci:server:assets: building assets touched git-visible files:" >&2
  echo "$dirty" >&2
  echo "priv/static/assets is build output; it must not be tracked." >&2
  exit 1
fi
"""

[tasks."ci:server:vuln"]
description = "Reject vulnerable or retired Hex dependencies"
dir         = "server"
run         = "mix hex.audit"

[tasks."ci:server:cover"]
description = "Server tests with coverage summary (non-blocking)"
run         = """
mise run db-up
cd server
MIX_ENV=test mix test --cover --exclude integration --exclude real_opencode --exclude real_claude --exclude real_jcode
"""

[tasks."ci:docker:server"]
description = "Build production server Docker image (dry-run, no push)"
run         = "docker build -t omashiki/server:ci-check -f server/Dockerfile server/"

[tasks."ci:docker:agent"]
description = "Build production opencode agent Docker image (dry-run, no push)"
run         = """
docker build -t omashiki/agent:ci-check agent/
.scripts/agent_image_check.sh omashiki/agent:ci-check 2048 bash git curl python3 mise opencode
.scripts/agent_toolchain_check.sh omashiki/agent:ci-check
"""

# No agent_toolchain_check.sh here on purpose: omashiki.toml declares
# [harnesses.claude-code] but no [environments.claude-code], so nothing ever
# runs `mise install` against this image and it ships no C toolchain. Adding
# the check would spend two minutes asserting a capability the image is not
# meant to have.
[tasks."ci:docker:claude"]
description = "Build pinned Claude Code agent Docker image (dry-run, no push)"
run         = """
docker build -t omashiki/agent-claude:ci-check -f agent/Dockerfile.claude agent/
.scripts/agent_image_check.sh omashiki/agent-claude:ci-check 2048 bash git curl python3 mise node claude
"""

[tasks."ci:docker:codex"]
description = "Build pinned OpenAI Codex CLI agent Docker image (dry-run, no push)"
run         = """
docker build -t omashiki/agent-codex:ci-check -f agent/Dockerfile.codex agent/
.scripts/agent_image_check.sh omashiki/agent-codex:ci-check 2048 bash git curl python3 mise node codex
.scripts/agent_toolchain_check.sh omashiki/agent-codex:ci-check
"""

# jcode deliberately ships neither curl, python3 nor mise: it has no
# HEALTHCHECK and runs no supply-chain relay, and the jcode environments in
# omashiki.toml declare empty `pre_steps` and no caches, so nothing ever
# invokes `mise install` for it. Its contract is correspondingly narrower — do
# not copy the list above onto it, and keep those `pre_steps` empty.
[tasks."ci:docker:jcode"]
description = "Build pinned jcode agent Docker image (dry-run, no push)"
run         = """
docker build -t omashiki/agent-jcode:ci-check -f agent/Dockerfile.jcode agent/
.scripts/agent_image_check.sh omashiki/agent-jcode:ci-check 1024 bash git jcode python3
"""

# pi is a coding harness, so its environment manages dependencies through mise
# like [environments.opencode] and [environments.codex] do, and this image
# carries the mise binary plus the OTP toolchain that `mise install --yes`
# needs. That requirement belongs to the environment, not to the harness
# binary: deriving the contents from what pi alone executes is what left mise
# out at first. curl comes with it: kerl fetches the OTP source tarball with
# curl, so `mise install --yes` dies at "curl: not found" without it. python3
# stays out — it is only for the supply-chain relay, which this image does not
# run — and so does node, because pi ships on npm but the release is a
# bun-compiled executable linking only glibc.
#
# 2048MB against a measured 947MB: 86MB base + 407MB apt (the OTP toolchain is
# almost all of it) + 95MB mise + 114MB pi. Up from 430MB before mise, and the
# same budget as the other two images carrying that toolchain. This gate exists
# to catch a 6GB base regression — the omaterm inheritance — not to police a
# debian point release, so the headroom is deliberate.
#
# agent_toolchain_check.sh runs here for the reason it was written: asserting
# the mise *binary* does not assert that `mise install` can build erlang, and an
# image that passes the first and fails the second builds green, passes the size
# budget, and then fails every job. Costs roughly two minutes.
[tasks."ci:docker:pi"]
description = "Build pinned pi agent Docker image (dry-run, no push)"
run         = """
docker build -t omashiki/agent-pi:ci-check -f agent/Dockerfile.pi agent/
.scripts/agent_image_check.sh omashiki/agent-pi:ci-check 2048 bash git curl mise pi
.scripts/agent_toolchain_check.sh omashiki/agent-pi:ci-check
"""

[tasks."ci:docker"]
description = "Build server + agent Docker images (dry-run, no push)"
depends     = ["ci:docker:server", "ci:docker:agent", "ci:docker:claude", "ci:docker:codex", "ci:docker:jcode", "ci:docker:pi"]

[tasks.ci]
description = "Run the full local CI matrix"
run         = ".scripts/ci.sh"

# --- Agent container images (rebuild after changes under agent/) ---

[tasks."arch:check"]
description = "Run static and ExUnit architecture consistency checks"
run         = ".scripts/arch_check.sh"

[tasks."arch:check:fast"]
description = "Run only the static architecture checks"
run         = ".scripts/arch_check.sh --fast"

[tasks."arch:check:strict"]
description = "Show all violations, ignoring .scripts/arch-exceptions.txt"
run         = ".scripts/arch_check.sh --fast --strict"

[tasks."hooks:install"]
description = "Install the versioned pre-push hook that runs local CI"
run         = ".scripts/install-hooks.sh"

[tasks."skill:install"]
description = "Install the Omashiki Agent Skill in ~/.agents/skills"
run         = "install -Dm0644 .agents/skills/omashiki/SKILL.md \"${HOME:?HOME must be set}/.agents/skills/omashiki/SKILL.md\""

[tasks."agent:build"]
description = "Build omashiki/agent:latest from agent/ (idempotent — Docker caches layers)"
run         = "docker build -t omashiki/agent:latest agent/"

[tasks."agent:claude:build"]
description = "Build omashiki/agent-claude:latest with Claude Code 2.1.240"
run         = "docker build -t omashiki/agent-claude:latest -f agent/Dockerfile.claude agent/"

[tasks."agent:jcode:build"]
description = "Build omashiki/agent-jcode:latest from agent/Dockerfile.jcode"
run         = "docker build -t omashiki/agent-jcode:latest -f agent/Dockerfile.jcode agent/"

[tasks."agent:pi:build"]
description = "Build omashiki/agent-pi:latest from agent/Dockerfile.pi"
run         = "docker build -t omashiki/agent-pi:latest -f agent/Dockerfile.pi agent/"

[tasks."agent:cache-smoke"]
description = "Validate cold/warm/offline and concurrent mise/npm cache use"
depends     = ["agent:build"]
run         = "bash agent/test-cache.sh"

[tasks."overture:wipe"]
description = "Recreate the ignored overture Git fixture safely"
run         = "python .scripts/overture_e2e.py wipe"

[tasks."e2e:prepare"]
description = "Prepare overture, every provider snapshot and the database for E2E"
run         = """
mise run overture:wipe
python .scripts/overture_e2e.py prepare all
mise run deps
mise run db-up
cd server
MIX_ENV=test mix ecto.reset
"""

[tasks."e2e:prepare:opencode"]
description = "Prepare isolated OpenCode overture fixture"
run         = """
mise run overture:wipe
python .scripts/overture_e2e.py prepare opencode
mise run deps
mise run db-up
cd server
MIX_ENV=test mix ecto.reset
"""

[tasks."e2e:prepare:claude"]
description = "Prepare isolated Claude Code overture fixture"
run         = """
mise run overture:wipe
python .scripts/overture_e2e.py prepare claude
mise run deps
mise run db-up
cd server
MIX_ENV=test mix ecto.reset
"""

# jcode stages no host credential snapshot: it reaches the model only through
# the gateway, which resolves the local server address from
# OMASHIKI_LOCAL_LLM_BASE_URL. The prepare step fails early when it is unset.
[tasks."e2e:prepare:jcode"]
description = "Prepare isolated jcode overture fixture against the local model server"
run         = """
mise run overture:wipe
python .scripts/overture_e2e.py prepare jcode
mise run deps
mise run db-up
cd server
MIX_ENV=test mix ecto.reset
"""

[tasks."e2e:overture:opencode"]
description = "Run the real queue-only Docker/OpenCode E2E against overture"
run         = """
mise run e2e:prepare:opencode
mise run agent:build
cd server
OMASHIKI_REAL_PROVIDER_E2E=1 \
OMASHIKI_AGENT_NETWORK_MODE=bridge \
MIX_ENV=test \
mix test test/integration/queue_real_provider_e2e_test.exs --include real_opencode --exclude real_claude --exclude real_jcode
"""

[tasks."e2e:overture:claude"]
description = "Run the real queue-only Docker/Claude Code E2E against overture"
run         = """
mise run e2e:prepare:claude
mise run agent:claude:build
cd server
OMASHIKI_REAL_PROVIDER_E2E=1 \
OMASHIKI_AGENT_NETWORK_MODE=bridge \
MIX_ENV=test \
mix test test/integration/queue_real_provider_e2e_test.exs --include real_claude --exclude real_opencode --exclude real_jcode
"""

# `agent:jcode:build` and not `agent:build`: omashiki/agent:latest is the
# OpenCode image and overwriting it here would silently retag it.
#
# Host networking, not bridge: jcode's only model path is the host LLM
# gateway. Docker bridge on this machine cannot hairpin to Phoenix, while
# host mode uses 127.0.0.1 which jcode also accepts as a local base URL.
[tasks."e2e:overture:jcode"]
description = "Run the real queue-only Docker/jcode E2E against overture and the local model server"
run         = """
mise run e2e:prepare:jcode
mise run agent:jcode:build
cd server
OMASHIKI_REAL_PROVIDER_E2E=1 \
OMASHIKI_AGENT_NETWORK_MODE=host \
MIX_ENV=test \
mix test test/integration/queue_real_provider_e2e_test.exs --include real_jcode --exclude real_opencode --exclude real_claude
"""

[tasks."e2e:overture"]
description = "Run every real provider E2E sequentially with isolated fixture preparation"
run         = """
mise run e2e:overture:opencode
mise run e2e:overture:claude
mise run e2e:overture:jcode
"""

[tasks."e2e:vm"]
description = "Run the distributed Fedora VM Docker/jcode E2E"
run         = "vm/run.sh"
