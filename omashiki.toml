# Local Omashiki configuration.
#
# Single source of declared repositories, harnesses, environments, caches,
# credentials, and limits. The database stores what happens: jobs, queues, and
# events.
#
# The execution registry below — repositories, harnesses, environments,
# credentials, caches, limits — reloads hot from /runtime with no restart. See
# [reload]. The infrastructure sections at the top ([app], [db], [auth]) are
# read by the entrypoints and by config/runtime.exs before the core is up, and
# still need a restart.
#
# Also read by:
#   .scripts/omashiki.py       injects configured ports into Compose and Mix
#   server/config/runtime.exs  applies ports and authentication to Endpoint/Ecto
#
# Infrastructure precedence: environment variable > this file > code default.
# Execution declarations come only from this file through `Omashiki.Config`.

[app]
# Phoenix HTTP port.
port = 4010

# Bind interface. Containers reach the gateway through host.docker.internal on
# the bridge, for example 172.17.0.1. Loopback-only binding leaves agents with
# no route. 0.0.0.0 serves the browser on 127.0.0.1 and containers through the
# bridge. Restrict access with a firewall on shared networks.
host = "0.0.0.0"

[db]
# PostgreSQL host port. The container always listens on 5432 internally; this
# value is only the external mapping used by Compose and Ecto. Port 5432 is
# commonly occupied by other local projects.
port = 5442

[auth]
# false disables login completely: LiveView and API requests use the local
# operator. This maps to the existing `:auth_mode` (`:bearer` when true,
# `:none` when false), keeping one authentication concept.
#
# With false and no database user, boot creates a local owner so screens that
# depend on `current_user` continue to work.
enabled = false

# ---------------------------------------------------------------------------
# Execution registry
# ---------------------------------------------------------------------------

# How a hot reload of this file lands on work that is already running.
#
# Every job captures its repository, environment and registry digest at
# admission, so a running attempt always finishes on the configuration it was
# admitted with, whatever this says. What this chooses is what happens to the
# attempts that have not started yet.
#
#   gradual   (default) Swap immediately. New jobs are admitted against the new
#             configuration; attempts already running finish on theirs. The
#             fleet is briefly split, and /runtime shows the split as a
#             percentage with the containers on each side. Nothing waits.
#
#   drain_all Close admission, wait for every active attempt to terminate, then
#             swap, then reopen. Nothing ever runs two configurations at once.
#             Costs the queueing time of the longest attempt.
#
# drain_timeout_ms bounds the wait. If it expires with attempts still running
# the drain is abandoned: admission reopens and this file is NOT applied.
# Nothing is cancelled — a config change does not kill a user's job. Use
# gradual if you need the change through a long-running attempt.
[reload]
mode = "gradual"
drain_timeout_ms = 300000

[limits]
max_concurrent_containers = 8
cpu_per_container = 2.0
memory_per_container = "2GB"
pids_limit = 256

[caches.global]
host = "~/.cache/omashiki/global"
max_size_mb = 8192

[caches.global.env]
MISE_DATA_DIR = "/omashiki-cache/global/mise/data"
MISE_CACHE_DIR = "/omashiki-cache/global/mise/cache"
XDG_CACHE_HOME = "/omashiki-cache/global/xdg"
npm_config_cache = "/omashiki-cache/global/npm"
CARGO_HOME = "/omashiki-cache/global/cargo"
GOMODCACHE = "/omashiki-cache/global/go/mod"
UV_CACHE_DIR = "/omashiki-cache/global/uv"
PIP_CACHE_DIR = "/omashiki-cache/global/pip"
MIX_HOME = "/omashiki-cache/global/mix"
HEX_HOME = "/omashiki-cache/global/hex"

# Supply-chain policy is opt-in. In allowlist mode, configure the internal
# Docker network before attaching this cache.
# [caches.global.policy]
# mode = "allowlist" # off | audit | allowlist
#
# [caches.global.policy.registries.npm.public]
# url = "https://registry.npmjs.org"
#
# [caches.global.policy.registries.cargo.public]
# url = "https://index.crates.io"
# download_url = "https://static.crates.io/crates/{crate}/{crate}-{version}.crate"
#
# [caches.global.policy.registries.go.public]
# url = "https://proxy.golang.org"
#
# [caches.global.policy.packages.npm]
# "example-package" = "1.0.0"
#
# [caches.global.policy.packages.cargo]
# serde = "1.0.*"
#
# [caches.global.policy.packages.go]
# "example.com/module" = "v1.2.3"

# Execution nodes: the machines that run attempts. Optional, and left out here.
#
# Without this section there is exactly one implicit node — this machine — and
# every path behaves as it did before nodes existed. Declare it only when more
# than one machine shares the queue.
#
# A name is the whole declaration. Capacity is deliberately not one of its
# options: a machine's container budget is [limits].max_concurrent_containers in
# that machine's own omashiki.toml, which is where the rest of its host limits
# already live. Each node reconciles its own execution_capacity row at boot from
# that value, so declaring the number here as well would be two sources for one
# fact. Per-node Docker endpoint arrives with the change that reads it.
#
# The name must be kebab-case, like every other registry section. A process
# picks its own node from OMASHIKI_NODE, falling back to the hostname, so a
# machine named after its host needs no environment variable. Declaring nodes
# and then booting on a machine that is not in the list fails config load
# rather than letting it claim work under a node id nothing else knows about.
#
# The node list is deliberately outside the registry digest: adding or draining
# a machine is a deployment, not configuration drift, and must not invalidate
# the digest every in-flight job was admitted under.
#
# [nodes.builder-01]
# [nodes.builder-02]

[repositories.omashiki]
path = "."
base_branch = "master"

# Canonical Git remote for finished job artifacts. Optional: without it the
# `omashiki/job-<id>` branch only exists in `path`, on the node that ran the
# attempt, so any other node reports success while delivering nothing.
#
# The remote is also what arbitrates a branch-name collision between nodes —
# the push refuses a name that already exists there — so a cluster must declare
# one. Push credentials are not declared here: the push runs on the host as the
# Omashiki user and authenticates through the SSH agent, `~/.ssh/config`, or a
# credential helper. Keeping them off this file keeps them out of the agent
# container, where they would let an agent bypass the artifact safety checks.
#
# remote = "git@github.com:example/omashiki.git"

[harnesses.opencode]
adapter = "opencode"
runtime = "docker"
image = "omashiki/agent:latest"
options = { auth_path = "/run/omashiki/state/auth.json", config_path = "/run/omashiki/state/opencode.json" }

[harnesses.claude-code]
adapter = "claude-code"
runtime = "docker"
image = "omashiki/agent-claude:latest"

[environments.opencode]
harness = "opencode"
executables = ["mise", "git"]
credentials = ["opencode-local"]
caches = ["global"]
timeout_ms = 1800000
network = "none"
mounts = []
post_steps = []
pre_steps = [{ argv = ["mise", "install", "--yes"], condition = "always", timeout_ms = 600000 }]

[environments.opencode.policy]
mode = "off"

[environments.opencode.resources]
cpus = 2.0
memory = "2GB"
pids = 256

# ---------------------------------------------------------------------------
# Gateway credentials
# ---------------------------------------------------------------------------
# Reached by the gateway on the host. The container is handed a job-bound token
# and the gateway's own base URL, never these values.
#
# `${env:VAR}` is resolved when this file loads and fails the boot naming the
# variable, so a private LAN address never lands in this git-tracked file.
# Export it before starting Omashiki:
#
#   export OMASHIKI_LOCAL_LLM_BASE_URL=http://<host>:8080/v1
#
# Use the *instruct* build. The 0.5B GGUF is the base model: it never emits a
# stop token under an agent system prompt and generates until the slot context
# is exhausted (29k tokens / 121 s per turn). The 1.5B instruct answers the
# same prompt in 0.7 s with finish_reason=stop.

# COMMENTED OUT until a local model server exists on this LAN.
#
# `base_url` resolves at load, not at use, so with OMASHIKI_LOCAL_LLM_BASE_URL
# unset this block does not degrade to a runtime 401 -- it aborts the boot,
# and `omashiki.toml` is read by *every* entrypoint. Leaving it live therefore
# breaks `mise run dev` and, because overture_e2e.py builds omashiki.e2e.toml
# as this file plus additions, also breaks e2e:overture:opencode and :claude --
# two paths that work today. Same reason [nodes] above ships commented out.
#
# To enable: export the variable, then uncomment through the resources block.
#[credentials.local-llm]
#provider = "llamacpp"
#model = "qwen2.5-coder-1.5b-instruct"
#base_url = "${env:OMASHIKI_LOCAL_LLM_BASE_URL}"
#api_key = "unused-by-llama-server"
#
#[harnesses.jcode]
#adapter = "jcode"
#runtime = "docker"
#image = "omashiki/agent-jcode:latest"
#options = { timeout_ms = 1800000 }
#
## jcode is a single static binary: no mise, no npm, no cache mounts, and no
## host-auth route — it always reaches the model through the gateway, so the
## network must not be "none" and the credential must be a gateway credential.
#[environments.jcode]
#harness = "jcode"
#executables = ["git"]
#credentials = ["local-llm"]
#caches = []
#timeout_ms = 1800000
#network = "restricted"
#mounts = []
#post_steps = []
#pre_steps = []
#
#[environments.jcode.policy]
#mode = "off"
#
#[environments.jcode.resources]
#cpus = 1.0
#memory = "1GB"
#pids = 256

# ---------------------------------------------------------------------------
# Host credential origins
# ---------------------------------------------------------------------------
# Read fresh at every attempt and copied into a private per-attempt directory
# mounted at /run/omashiki/state. Changing the file contents needs no restart;
# changing which file is the origin does.

[host_credentials.opencode-local]
kind = "opencode"
auth = "~/.local/share/opencode/auth.json"
config = "~/.config/opencode/opencode.json"

[host_credentials.claude-local]
kind = "claude-code"
credentials = "~/.claude/.credentials.json"

[host_credentials.codex-local]
kind = "codex"
credentials = "~/.codex/auth.json"

[harnesses.codex]
adapter = "codex"
runtime = "docker"
image = "omashiki/agent-codex:latest"

[environments.codex]
harness = "codex"
executables = ["mise", "git"]
credentials = ["codex-local"]
caches = ["global"]
timeout_ms = 1800000
network = "restricted"
mounts = []
post_steps = []
pre_steps = [{ argv = ["mise", "install", "--yes"], condition = "always", timeout_ms = 600000 }]

[environments.codex.policy]
mode = "off"

[environments.codex.resources]
cpus = 2.0
memory = "2GB"
pids = 256

# ---------------------------------------------------------------------------
# pi
# ---------------------------------------------------------------------------
# pi itself is a single `bun build --compile` executable: no node and no npm.
# Its *environment*, though, is a coding environment, so dependencies are
# managed through mise exactly as [environments.opencode] and
# [environments.codex] manage them — hence `mise` in executables, the global
# cache, and the `mise install --yes` pre_step below. Do not read pi's own
# slimness as licence to drop those: the harness binary and the environment
# have different requirements, and this is the environment's.
#
# `caches = ["global"]` is what makes that install cheap. [caches.global.env]
# redirects MISE_DATA_DIR into the mount, so a toolchain built once is reused by
# every later attempt instead of being rebuilt in each container.
#
# Like jcode it has no host-auth route — it always reaches the model through the
# gateway — so its environment needs a gateway credential and a network that is
# not "none".
#
# The harness is declared live and the environment is not, which is the same
# split [harnesses.claude-code] already uses: a harness with no environment is
# legal and costs nothing, but [environments.pi] would have to name a
# credential, and the only one that fits is [credentials.local-llm] above.
# That credential resolves `${env:OMASHIKI_LOCAL_LLM_BASE_URL}` at *load*, so
# uncommenting it with the variable unset aborts the boot of every entrypoint
# that reads this file — `mise run dev` and the two working overture E2Es
# included. Uncomment both together, after exporting the variable.

[harnesses.pi]
adapter = "pi"
runtime = "docker"
image = "omashiki/agent-pi:latest"
options = { timeout_ms = 1800000 }

#[environments.pi]
#harness = "pi"
#executables = ["mise", "git"]
#credentials = ["local-llm"]
#caches = ["global"]
#timeout_ms = 1800000
#network = "restricted"
#mounts = []
#post_steps = []
#pre_steps = [{ argv = ["mise", "install", "--yes"], condition = "always", timeout_ms = 600000 }]
#
#[environments.pi.policy]
#mode = "off"
#
## Sized like [environments.opencode], because the pre_step is the same and it
## is the expensive part: mise compiles erlang from source the first time the
## cache is cold. A high-concurrency load-test tier would want far less; that
## belongs in .scripts/loadtest/README.md, not here.
#[environments.pi.resources]
#cpus = 2.0
#memory = "2GB"
#pids = 256
