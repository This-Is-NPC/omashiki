# Omashiki on one machine: PostgreSQL + the published image in the embedded
# role, which serves the UI and the API and runs the agent containers.
#
# Keep this file next to omashiki.toml, then:
#   cat > .env <<EOF
#   SECRET_KEY_BASE=$(openssl rand -base64 48)
#   OMASHIKI_UID=$(id -u)
#   OMASHIKI_GID=$(id -g)
#   OMASHIKI_DOCKER_GID=$(stat -c %g /var/run/docker.sock)
#   EOF
#   docker compose up -d
#
# .env may also set OMASHIKI_VERSION (default latest) and OMASHIKI_PORT
# (default 4010). See docs/how-to-install-from-the-image.md.
#
# Mount host credential origins read-only with a compose.override.yml:
# see docs/how-to-configure-model-access.md.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omashiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omashiki"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  omashiki:
    image: ghcr.io/this-is-npc/omashiki:${OMASHIKI_VERSION:-latest}
    # The house runs as the operator, so what it writes in the mounted host
    # directories belongs to them, and in the Docker socket's group, so it
    # can start the agent containers.
    user: "${OMASHIKI_UID:?set OMASHIKI_UID to your user id}:${OMASHIKI_GID:?set OMASHIKI_GID to your group id}"
    group_add:
      - "${OMASHIKI_DOCKER_GID:?set OMASHIKI_DOCKER_GID to the group of /var/run/docker.sock}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The host Docker daemon starts the agent containers and mounts paths
      # the house names, so the house uses the host's home directory.
      HOME: ${OMASHIKI_HOST_HOME:-${HOME}}
      OMASHIKI_ROLE: embedded
      DATABASE_URL: ecto://postgres:postgres@db/omashiki
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE to a long random value}
      OMASHIKI_CONFIG: /config/omashiki.toml
      OMASHIKI_UI_CONFIG: /config/ui.toml
      # The port inside the container, which the published port and
      # OMASHIKI_HOUSE_URL name.
      PORT: "4000"
      OMASHIKI_DOCKER_SOCKET_PATH: /var/run/docker.sock
      # Agent containers join the agents network below, where the house
      # reaches each one and they reach the house by its service name.
      OMASHIKI_AGENT_NETWORK_MODE: ${COMPOSE_PROJECT_NAME}-agents
      OMASHIKI_HOUSE_URL: http://omashiki:4000
    ports:
      - "${OMASHIKI_PORT:-4010}:4000"
    networks:
      - default
      - agents
    volumes:
      # The directory holding omashiki.toml and ui.toml, writable: the Config
      # screen's Files page saves by renaming a new file over the old one,
      # which a single-file bind mount cannot take, and keeps named copies and
      # history in .omashiki-files/ beside them.
      - ${OMASHIKI_CONFIG_DIR:-.}:/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OMASHIKI_HOST_HOME:-${HOME}}/.cache/omashiki:${OMASHIKI_HOST_HOME:-${HOME}}/.cache/omashiki
      # Cache use records, which the house keeps beside the caches.
      - ${OMASHIKI_HOST_HOME:-${HOME}}/.local/state/omashiki:${OMASHIKI_HOST_HOME:-${HOME}}/.local/state/omashiki
      # Agent secret files land in /dev/shm; share the host path so the
      # daemon can bind-mount them into job containers.
      - /dev/shm:/dev/shm
    restart: unless-stopped

networks:
  # Named after the Compose project, so houses on one Docker daemon keep
  # their agents apart. The database stays off it.
  agents:
    name: ${COMPOSE_PROJECT_NAME}-agents

volumes:
  pgdata:
