# Omashiki: starter configuration for deploy/compose.yml.
# Each section is described in docs/configuration.md.

# Browser login and API tokens. Create the first operator at /signup.
[auth]
enabled = true

# This machine's container budget.
[limits]
max_concurrent_containers = 4
cpu_per_container = 2.0
memory_per_container = "2GB"
pids_limit = 256

# The agent image. Build it from agent/Dockerfile or name your own.
[runtimes.docker.runc.debian.images]
opencode = "omashiki/agent:latest"

[presets.opencode]
plugin = "opencode"
options = { model = "opencode-go/glm-5.3-flash", auth_path = "/run/omashiki/state/auth.json", config_path = "/run/omashiki/state/opencode.json" }

# A job in this environment returns files; it needs no repository.
[environments.opencode]
preset = "opencode"
runtime = "docker.runc.debian"
sink = "files"
packages = []
executables = []
credentials = ["opencode-local"]
caches = []
timeout_ms = 1800000
network = "restricted"
mounts = []
pre_steps = []
post_steps = []

[environments.opencode.policy]
mode = "off"

[environments.opencode.resources]
cpus = 2.0
memory = "2GB"
pids = 256

# OpenCode's login on this machine, read at each attempt.
[host_credentials.opencode-local]
kind = "opencode"
auth = "~/.local/share/opencode/auth.json"
config = "~/.config/opencode/opencode.json"
